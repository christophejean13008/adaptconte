<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<title>Adaptconte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Mise en page : une seule page-écran. En haut le chemin du conte (5 étapes), au centre la phrase qui se construit, en bas les 6 cartes à choisir. */
:root{
  --ciel:#e6f1ff; --papier:#ffffff; --encre:#1b2452; --doux:#5b6590; --trait:#c4d5ef;
  --soleil:#ffc531; --soleil-fonce:#b97f00;
  --nom:#2a6be0; --adj:#17935a; --verbe:#dc3d33; --comp:#c96a00; --name:#8346d4;
  --corps:"Andika","Trebuchet MS","Segoe UI",sans-serif;
  --titre:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ciel);color:var(--encre);font-family:var(--corps);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--name);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:10px 14px;gap:10px}

/* Chemin du conte */
#chemin{display:flex;align-items:center;gap:8px}
.rond{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--trait);background:var(--papier);font-size:20px;display:grid;place-items:center;padding:0}
.etapes{flex:1;min-width:0;display:flex;gap:6px}
.etape{flex:1;min-width:0;border:2px solid var(--trait);background:var(--papier);border-radius:14px;padding:4px 6px;display:flex;align-items:center;gap:6px;text-align:left;color:var(--doux)}
.etape b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ciel);display:grid;place-items:center;font-family:var(--titre);font-size:17px}
.etape span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700}
.etape.fait b{background:var(--adj);color:#fff}
.etape.ici{border-color:var(--encre);color:var(--encre);background:var(--soleil)}
.etape.ici b{background:var(--encre);color:#fff}
.etape:disabled{opacity:.5;cursor:default}
@media (max-width:720px){.etape{justify-content:center}.etape span{display:none}}

#vue>*{flex-shrink:0}
.nb{white-space:nowrap}
#vue{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
h1,h2{font-family:var(--titre);margin:0;line-height:1.1;text-wrap:balance}
.sur{font-size:15px;font-weight:700;color:var(--doux);letter-spacing:.04em;text-transform:uppercase;margin:0}

/* Phrase en construction */
.phrase{background:var(--papier);border-radius:20px;padding:14px 18px;font-size:clamp(20px,2.7vw,28px);line-height:2;border:2px solid var(--trait)}
.phrase.grand{font-size:clamp(24px,3.4vw,36px);line-height:1.8}
.chip{border:0;background:none;padding:0 4px;border-radius:8px;font-weight:700;border-bottom:4px solid currentColor}
.k-nom{color:var(--nom)}.k-adj{color:var(--adj)}.k-verbe{color:var(--verbe)}.k-comp{color:var(--comp)}.k-name{color:var(--name)}
.blank{font-weight:400;font-size:.62em;border:2px dashed currentColor;border-radius:10px;padding:4px 12px;vertical-align:middle;opacity:.75;background:var(--papier)}
.blank.cur{opacity:1;background:var(--soleil);border-style:solid;color:var(--encre);font-weight:700;animation:pouls 1.2s ease-in-out infinite}
.syl-a{color:#2a6be0}.syl-b{color:#dc3d33}
@keyframes pouls{50%{transform:scale(1.08)}}

/* Question et cartes */
.q{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:clamp(22px,3vw,30px)}
.tag{font-family:var(--corps);font-size:15px;font-weight:700;color:#fff;border-radius:99px;padding:3px 12px}
.tag.k-nom{background:var(--nom)}.tag.k-adj{background:var(--adj)}.tag.k-verbe{background:var(--verbe)}.tag.k-comp{background:var(--comp)}.tag.k-name{background:var(--name)}
.cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.cartes{grid-template-columns:repeat(2,1fr)}}
.carte{position:relative;min-width:0;background:var(--papier);border:3px solid currentColor;border-radius:20px;padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:112px;cursor:pointer;box-shadow:0 5px 0 currentColor;transition:transform .08s}
.carte:active{transform:translateY(4px);box-shadow:0 1px 0 currentColor}
.carte .em{font-size:44px;line-height:1.1}
.carte .mot{color:var(--encre);font-size:clamp(19px,2.4vw,25px);font-weight:700;text-align:center;overflow-wrap:anywhere}
.carte.sans .mot{font-size:clamp(22px,3vw,30px)}
.ecoute{position:absolute;top:4px;right:4px;width:38px;height:38px;border-radius:50%;border:0;background:var(--ciel);font-size:17px;padding:0}
.outils{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--encre);background:var(--papier);border-radius:16px;padding:10px 18px;font-weight:700;font-size:18px;display:inline-flex;align-items:center;gap:8px;min-height:50px;cursor:pointer}
.btn.fort{background:var(--soleil);box-shadow:0 4px 0 var(--soleil-fonce);font-size:21px;padding:12px 24px}
.btn.fort:active{transform:translateY(3px);box-shadow:0 1px 0 var(--soleil-fonce)}
.btn.choisi{background:var(--encre);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.champ{border:2px solid var(--encre);border-radius:14px;padding:10px 14px;font-size:20px;min-width:0;flex:1 1 180px;background:var(--papier)}
.boite{background:var(--papier);border:2px dashed var(--trait);border-radius:18px;padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Dés */
.des{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding-block:6px}
.de{width:clamp(92px,17vw,132px);aspect-ratio:1;border-radius:24px;border:3px solid var(--encre);background:var(--papier);box-shadow:0 7px 0 var(--encre);font-family:var(--titre);font-size:clamp(34px,6vw,52px);display:grid;place-items:center;padding:0}
.de.roule{animation:roule .35s linear infinite}
@keyframes roule{0%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-12px)}100%{transform:rotate(-9deg) translateY(0)}}
.nomde{text-align:center;font-family:var(--titre);font-size:clamp(40px,7vw,64px);min-height:1.2em;line-height:1.2}
.centre{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}

/* Accueil */
.accueil{display:grid;gap:18px;padding-block:8px}
.accueil h1{font-size:clamp(44px,8vw,76px)}
.accueil h1 em{font-style:normal;color:var(--name)}
.accueil p{margin:0;max-width:60ch}
.plan{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0;padding:0;list-style:none}
@media (max-width:720px){.plan{grid-template-columns:1fr}}
.plan li{background:var(--papier);border-radius:16px;padding:10px 12px;border:2px solid var(--trait);min-width:0}
.plan b{font-family:var(--titre);font-size:20px;display:block}
.plan i{font-style:normal;color:var(--name);font-weight:700;display:block}
.plan small{color:var(--doux);font-size:14px}
.adulte{margin-top:28px;background:var(--papier);border:2px dashed var(--trait);border-radius:16px;padding:12px 14px;display:grid;gap:8px;font-size:14px;color:var(--doux)}
.adulte h2{font-family:var(--corps);font-size:15px;color:var(--encre);letter-spacing:.04em;text-transform:uppercase}
.adulte .sur{font-size:12px;margin-top:4px}
.adulte .btn{font-size:14px;min-height:36px;padding:5px 12px;border-width:1.5px;border-radius:10px;font-weight:400}
.adulte .btn.choisi{font-weight:700}
.adulte .champ{font-size:14px;padding:6px 10px;border-width:1.5px;border-radius:10px}
.adulte p{max-width:none}

/* Film */
.scene{position:relative;overflow:hidden;border-radius:24px;aspect-ratio:16/9;width:100%;max-width:760px;margin-inline:auto;font-size:clamp(46px,11vw,104px);border:3px solid var(--encre);background:#bfe3ff}
.scene .e{position:absolute;line-height:1;bottom:9%}
.scene img.plein{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.scene .carton{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px;padding:16px}
.scene .carton span{font-size:1em;line-height:1.1}
.scene .carton strong{font-family:var(--titre);font-size:.42em;line-height:1.1;color:var(--encre)}
.s0{background:linear-gradient(#fff3c4,#ffd76a)}
.s1{background:linear-gradient(#aedcff 60%,#9fd98a 60%)}
.s2{background:linear-gradient(#8f93b8 60%,#77806f 60%)}
.s3{background:linear-gradient(#c9ecc0 60%,#8fbf6c 60%)}
.s4{background:linear-gradient(#ffe7a3 60%,#e9c15f 60%)}
.s5{background:linear-gradient(#ffb98a,#ffd9a8 60%,#9fd98a 60%)}
.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
.bob{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both,bob 1.4s ease-in-out .7s infinite}
.gauche{animation:gauche 1.6s ease-out both}
.droite{animation:droite 1.2s ease-out both}
.vole{animation:vole 1.6s ease-in 1.5s both}
.fuit{animation:fuit 1.4s ease-in 1.4s both}
.brille{animation:brille 1.2s ease-in-out infinite}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-10%)}}
@keyframes gauche{from{transform:translateX(-260%)}to{transform:none}}
@keyframes droite{from{transform:translateX(260%)}to{transform:none}}
@keyframes vole{to{transform:translate(170%,-60%) scale(.5) rotate(25deg)}}
@keyframes fuit{to{transform:translate(120%,-120%) scale(0) rotate(540deg)}}
@keyframes brille{50%{opacity:.25;transform:scale(.7)}}
@keyframes zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
.legende{font-size:clamp(22px,3vw,30px);text-align:center;margin:0;min-height:3em;max-width:760px;margin-inline:auto}
.legende span{opacity:.3;transition:opacity .2s}
.legende span.on{opacity:1}
.conte{background:var(--papier);border-radius:20px;border:2px solid var(--trait);padding:16px 20px;display:grid;gap:10px;font-size:20px}
.conte h2{font-size:28px}
.conte p{margin:0;max-width:65ch}
.conte small{display:block;color:var(--doux);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.vignette{height:64px;border-radius:10px;border:2px solid var(--encre)}
/* Niveau 2 : toutes les propositions du vocabulaire des contes */
.cartes.tout{grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:10px}
.cartes.tout.large{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.cartes.tout .carte{min-height:64px;padding:8px 48px 10px 12px;flex-direction:row;justify-content:flex-start;gap:8px;border-radius:16px;box-shadow:0 4px 0 currentColor}
.cartes.tout .em{font-size:28px}
.cartes.tout .mot{font-size:19px;text-align:left;overflow-wrap:normal}
.cartes.tout .ecoute{top:50%;margin-top:-19px;right:5px}
.chip.encours{background:var(--soleil)}
.rubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:10px}
.rub{min-width:0;border:2px solid var(--trait);background:var(--papier);border-radius:14px;padding:8px 12px;text-align:left;display:grid;gap:2px;min-height:60px;align-content:center}
.rub b{font-size:17px}
.rub span{color:var(--adj);font-weight:700;font-size:16px}
.rub.fait{border-color:var(--adj);box-shadow:0 3px 0 var(--adj)}
.phrase.dense{font-size:clamp(17px,2vw,21px);line-height:1.85;max-height:9.6em;overflow-y:auto}
.phrase.dense.grand{max-height:none;font-size:clamp(19px,2.3vw,24px)}
.legende.long{font-size:19px}
.biblio{display:grid;gap:8px}
.hist{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hist .ouvre{flex:1 1 240px;min-width:0;justify-content:flex-start;text-align:left}
.hist small{font-weight:400;color:var(--doux)}
#toile-video,.video{display:block;width:100%;max-width:860px;height:auto;margin-inline:auto;border:3px solid var(--encre);border-radius:16px;background:#fff}
.dess{object-fit:contain;display:block}
.scene .dess{width:1.25em;height:1.25em}
.btn .dess{width:36px;height:36px}
/* Atelier de dessin */
.atelier{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.chevalet{flex:1 1 320px;min-width:0;text-align:center}
#toile{max-width:100%;max-height:62vh;background:#fff;border:3px solid var(--encre);border-radius:16px;touch-action:none;cursor:crosshair}
.palette{display:grid;gap:12px;max-width:100%}
.rang{display:flex;gap:8px;flex-wrap:wrap;max-width:272px;align-items:center}
.pastille{width:46px;height:46px;border-radius:50%;border:2px solid var(--encre);padding:0}
.pastille.choisi{box-shadow:0 0 0 3px var(--papier),0 0 0 7px var(--encre)}
.taille{padding:0;width:54px;justify-content:center}
.taille i{display:block;border-radius:50%;background:var(--encre)}
.taille.choisi i{background:#fff}
/* Impression : la même feuille sert à l'aperçu à l'écran et à l'impression */
#impression{display:none}
.feuille{color:#000;background:#fff;font-size:15pt;line-height:1.5}
.feuille h1{font-size:28pt;margin:0}
.feuille .auteur{margin:4pt 0 0;font-size:12pt;max-width:none}
.feuille section{break-inside:avoid;border-top:1pt solid #888;margin-top:14pt;padding-top:8pt;overflow:hidden}
.feuille h2{font-size:15pt;margin:0}
.feuille h2 small{font-family:var(--corps);font-weight:400;font-size:10pt;color:#444}
.feuille p{margin:4pt 0;max-width:none}
.feuille figure{display:inline-block;vertical-align:top;margin:6pt 10pt 0 0;text-align:center;font-size:10pt}
.feuille .ill{max-width:100%;max-height:8cm;border:1pt solid #000;border-radius:6pt;display:block}
.feuille .mini{display:block;height:3cm;width:3cm;font-size:2.2cm;line-height:3cm}
.feuille .mini .dess{width:3cm;height:3cm}
.feuille.compact{font-size:12pt;line-height:1.35}
.feuille.compact h1{font-size:18pt}
.feuille.compact .auteur{font-size:10pt;margin:0}
.feuille.compact section{margin-top:6pt;padding-top:4pt}
.feuille.compact h2{font-size:12pt}
.feuille.compact .images{float:right;margin:0 0 4pt 10pt;max-width:44%;text-align:right}
.feuille.compact figure{margin:0 0 0 6pt}
.feuille.compact .ill{max-height:4.2cm}
.feuille.compact .mini{height:1.8cm;width:1.8cm;font-size:1.3cm;line-height:1.8cm}
.feuille.compact .mini .dess{width:1.8cm;height:1.8cm}
.feuille.compact figcaption{display:none}
.apercu-cadre{overflow-x:auto;border-radius:12px;background:#8c93ad;padding:12px}
.apercu{box-sizing:border-box;width:202mm;padding:8mm;margin-inline:auto;box-shadow:0 2px 10px rgba(0,0,0,.3)}
@media print{
  @page{margin:1.2cm}
  html,body{height:auto;background:#fff}
  #app{display:none}
  #impression{display:block}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <nav id="chemin" aria-label="Les étapes du conte"></nav>
  <main id="vue"></main>
</div>
<div id="impression"></div>

function dis(txt,fin){
  let fait=false;const ok=()=>{if(!fait){fait=true;fin&&fin()}};
  if(!T.voice||!('speechSynthesis' in window))return ok();
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;
    u.onend=ok;u.onerror=ok;speechSynthesis.speak(u);
    if(fin)setTimeout(ok,txt.length*120+4000);
  }catch(e){ok()}
}

const PICTO_OK=['heros','porte','lieu','mechant','porteM','objet','lieu3','ami','moyen','desir','adv','situation','renc','magie'];

function enData(blob){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ko;r.readAsDataURL(blob)})}
async function chercheP(id){
  const it=T.S[id];
  if(!it||!PICTO_OK.includes(id)||!enLigne())return;
  const mot=motCle(it);if(!mot)return;
  if(T.pictos[id]&&T.pictos[id].w===mot)return;
  T.pictos[id]={w:mot,src:''};
  try{
    let liste=[];
    for(const q of [mot,mot.split(' ')[0]]){
      const r=await fetch('https://api.arasaac.org/api/pictograms/fr/search/'+encodeURIComponent(q));
      if(r.ok){liste=(await r.json()).filter(x=>!x.violence&&!x.sex);if(liste.length)break}
      if(!mot.includes(' '))break;
    }
    if(!liste.length){sauve();return}
    const url='https://static.arasaac.org/pictograms/'+liste[0]._id+'/'+liste[0]._id+'_300.png';

function nettoie(o){

function figure(x,imgs,id,cx,cy,t){
  const im=imgs[id];
  if(im){const k=Math.min(t/im.width,t/im.height);x.drawImage(im,cx-im.width*k/2,cy-im.height*k/2,im.width*k,im.height*k)}
  else{x.fillStyle='#1b2452';x.font=Math.round(t*.8)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText((T.S[id]&&T.S[id].e)||'⭐',cx,cy)}
}
function lignes(x,mots,larg){const L=[];let l=[];mots.forEach(m=>{if(l.length&&x.measureText(l.concat(m).join(' ')).width>larg){L.push(l);l=[m]}else l.push(m)});if(l.length)L.push(l);return L}
function dessinePage(x,imgs,pg,nlu){
  const FT='"Andika","Trebuchet MS","Segoe UI",sans-serif';
  x.fillStyle='#e6f1ff';x.fillRect(0,0,VW,VH);
  x.fillStyle='#ffffff';rr(x,30,24,VW-60,VH-48,28);x.fill();
  if(pg.type!=='etape'){
    x.fillStyle=FOND[0];rr(x,60,54,VW-120,VH-108,22);x.fill();
    if(pg.type==='titre')figure(x,imgs,'heros',VW/2,250,250);
    else{x.font='200px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('✨',VW/2,250)}
    x.fillStyle='#1b2452';x.textAlign='center';x.textBaseline='middle';
    let fs=88;do{fs-=4;x.font='bold '+fs+'px '+FT}while(x.measureText(pg.txt).width>VW-200&&fs>30);
    x.fillText(pg.txt,VW/2,pg.type==='titre'&&T.auteur?480:500);
    if(pg.type==='titre'&&T.auteur){x.font='40px '+FT;x.fillText('par '+T.auteur,VW/2,570)}
    return;
  }
  const im=imgs['e'+pg.n],zy=54,zh=420;
  if(im){const k=Math.min((VW-120)/im.width,zh/im.height);x.drawImage(im,VW/2-im.width*k/2,zy+zh/2-im.height*k/2,im.width*k,im.height*k)}
  else{
    x.fillStyle=FOND[pg.n+1];rr(x,60,zy,VW-120,zh,22);x.fill();
    const ids=figsEtape(pg.n),pas=(VW-200)/ids.length,t=Math.min(270,pas-30);
    ids.forEach((id,i)=>figure(x,imgs,id,100+pas*(i+.5),zy+zh/2,t));
  }
  const mots=pg.txt.split(' ');let fs=48,L;
  do{fs-=2;x.font=fs+'px '+FT;L=lignes(x,mots,VW-160)}while(L.length*fs*1.3>190&&fs>20);
  const ih=fs*1.3,esp=x.measureText(' ').width;let y=494+(196-L.length*ih)/2+ih/2,k=0;
  x.textBaseline='middle';x.textAlign='left';
  L.forEach(l=>{let px=VW/2-x.measureText(l.join(' ')).width/2;l.forEach(m=>{x.fillStyle=k<nlu?'#1b2452':'#9aa5c8';x.fillText(m,px,y);px+=x.measureText(m).width+esp;k++});y+=ih});
}
function abandonneVideo(){
  const R=REC;REC=null;if(!R)return;
  R.annule=true;
  try{if(R.rec&&R.rec.state!=='inactive')R.rec.stop()}catch(e){}
  clearInterval(R.garde);try{R.veille&&R.veille.release()}catch(e){}
  try{R.fermer&&R.fermer()}catch(e){}
  try{R.mr&&R.mr.state!=='inactive'&&R.mr.stop()}catch(e){}
  try{R.stream&&R.stream.getTracks().forEach(t=>t.stop());R.mic&&R.mic.getTracks().forEach(t=>t.stop());fermeAC(R.ac)}catch(e){}
  if(R.url)URL.revokeObjectURL(R.url);
}
function majBarre(){
  const z=document.getElementById('video-barre');if(!z||!REC)return;
  if(REC.etat==='lecture'){
    const fin=REC.i===REC.pages.length-1;
    z.innerHTML='<span>🎤 Lis la page à voix haute · page '+(REC.i+1)+' sur '+REC.pages.length+'</span><button class="btn fort" data-a="videoSuite">'+(fin?'✔ Terminer':'Page suivante ▶')+'</button><button class="btn" data-a="videoStop">Annuler</button>';return;
  }
  if(REC.etat==='encode'){z.innerHTML='<span>'+esc(REC.prep||'Fabrication de la vidéo…')+'</span><button class="btn" data-a="videoStop">Annuler</button>'+(REC.note?'<span>'+esc(REC.note)+'</span>':'');return}
  if(REC.etat==='prep'){z.innerHTML='<span>'+esc(REC.prep||'Préparation…')+'</span><button class="btn" data-a="videoStop">Annuler</button>';return}
  const der=REC.i===REC.pages.length-1;
  z.innerHTML='<span>⏺ Enregistrement · page '+(REC.i+1)+' sur '+REC.pages.length+'</span>'+(REC.voix?'<button class="btn fort" data-a="videoSuite">'+(der?'✔ Terminer':'Page suivante ▶')+'</button>':'')+'<button class="btn" data-a="videoStop">Annuler</button>'+(REC.note?'<span>'+esc(REC.note)+'</span>':'');
}
function pageSuivante(){
  const R=REC;if(!R||R.etat!=='rec')return;
  if(R.i<R.pages.length-1){R.i++;R.t0=performance.now();jouePage(R);majBarre()}
  else{R.etat='stop';try{R.rec.stop()}catch(e){}}
}
async function sonPage(ac,txt){
  const r=await fetch(T.urlIA,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voix:true,texte:txt})});
  const j=await r.json();
  if(!j.audio)throw new Error(j.erreur||'vide');
  const bin=atob(j.audio),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Promise((ok,ko)=>ac.decodeAudioData(u.buffer,ok,ko));
}
function jouePage(R){
  if(!R.ac)return;
  const b=R.sons[R.i],src=R.ac.createBufferSource();
  src.buffer=b;src.connect(R.dest);src.connect(R.ac.destination);src.start();
  R.duree=b.duration*1000;
}
async function videoDirecte(voix,ac,synth){
  // MP4 H.264 en priorité (lisible partout). « video/mp4 » sans précision n'est gardé que pour Safari, où il veut dire H.264.
  const ok=t=>MediaRecorder.isTypeSupported(t);
  let type=null;
  if(window.MediaRecorder&&HTMLCanvasElement.prototype.captureStream){
    type=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1.42E01E'].find(ok)||(ok('video/mp4')&&!ok('video/webm')?'video/mp4':null)||['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(ok)||null;
  }
  if(!type){REC={etat:'err',err:'Ce navigateur ne sait pas créer de vidéo. Essaie avec Safari sur iPad, ou avec Chrome.'};return rendVideo()}
  const KO_VOIX='La voix de l\'ordinateur n\'est pas disponible : pas de connexion, ou service d\'images à mettre à jour. Choisis « Avec ma voix » ou « Sans voix ».';
  if(synth&&!ac){REC={etat:'err',err:KO_VOIX};return rendVideo()}
  const R=REC={etat:'prep',voix,type,pages:pagesVideo(),i:0,t0:0,chunks:[],ac,sons:[]};
  rendVideo();
  if(ac){
    try{
      for(let i=0;i<R.pages.length;i++){
        R.prep='Préparation de la voix : page '+(i+1)+' sur '+R.pages.length+'…';majBarre();
        const pg=R.pages[i];
        R.sons.push(await sonPage(ac,pg.type==='titre'&&T.auteur?pg.txt+', par '+T.auteur+'.':pg.txt+(pg.type==='etape'?'':'.')));
        if(REC!==R){fermeAC(ac);return}
      }
    }catch(e){fermeAC(ac);if(REC===R){REC={etat:'err',err:KO_VOIX};rendVideo()}return}
  }
  R.imgs=await prepareImgs();
  const cv=document.getElementById('toile-video');if(!cv||REC!==R)return;
  const x=cv.getContext('2d');
  dessinePage(x,R.imgs,R.pages[0],voix?1e9:0);
  try{
    R.stream=cv.captureStream(30);
    if(ac){R.dest=ac.createMediaStreamDestination();R.dest.stream.getAudioTracks().forEach(t=>R.stream.addTrack(t))}
    if(voix){try{R.mic=await navigator.mediaDevices.getUserMedia({audio:true});R.mic.getAudioTracks().forEach(t=>R.stream.addTrack(t))}catch(e){R.voix=false;R.note='Le micro n\'est pas disponible : la vidéo sera sans voix.'}}
    if(REC!==R)return;
    R.rec=new MediaRecorder(R.stream,{mimeType:type,videoBitsPerSecond:3000000});
  }catch(e){REC={etat:'err',err:'La vidéo n\'a pas pu démarrer sur cet appareil.'};return rendVideo()}
  R.rec.ondataavailable=e=>{if(e.data&&e.data.size)R.chunks.push(e.data)};
  R.rec.onstop=()=>{
    clearInterval(R.garde);try{R.veille&&R.veille.release()}catch(e){}
    try{R.stream.getTracks().forEach(t=>t.stop());R.mic&&R.mic.getTracks().forEach(t=>t.stop());fermeAC(R.ac)}catch(e){}
    if(R.annule)return;
    R.blob=new Blob(R.chunks,{type:type.split(';')[0]});R.url=URL.createObjectURL(R.blob);R.etat='fini';
    if(REC===R&&T.view==='video')rendVideo();
  };
  R.rec.start();R.etat='rec';R.t0=performance.now();jouePage(R);majBarre();
  // Une image est redessinée et poussée dans la vidéo à chaque passage, même si la page ne change pas :
  // sans cela, certains navigateurs (Safari sur iPad) arrêtent d'enregistrer l'image pendant que le son continue.
  const piste=R.stream.getVideoTracks()[0];
  let dernier=0,bascule=0;
  const image=()=>{
    if(REC!==R||R.etat!=='rec')return false;
    dernier=performance.now();
    const pg=R.pages[R.i],dt=dernier-R.t0,n=pg.txt.split(' ').length;
    try{dessinePage(x,R.imgs,pg,R.ac?Math.ceil(n*Math.min(1,dt/R.duree)):R.voix?1e9:Math.floor(dt/400))}
    catch(e){x.fillStyle='#ffffff';x.fillRect(0,0,VW,VH);x.fillStyle='#1b2452';x.font='40px sans-serif';x.textAlign='center';x.textBaseline='middle';lignes(x,pg.txt.split(' '),VW-160).forEach((l,k)=>x.fillText(l.join(' '),VW/2,200+k*56))}
    bascule^=1;x.fillStyle=bascule?'#e6f1ff':'#e4effd';x.fillRect(0,0,3,3);
    try{if(piste&&piste.requestFrame)piste.requestFrame()}catch(e){}
    if(R.ac){if(dt>R.duree+900)pageSuivante()}
    else if(!R.voix&&dt>Math.max(2600,n*400+1600))pageSuivante();
    return true;
  };
  const boucle=()=>{if(image())requestAnimationFrame(boucle)};
  R.garde=setInterval(()=>{if(REC!==R||R.etat!=='rec')return clearInterval(R.garde);if(performance.now()-dernier>120)image()},60);
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(v=>{R.veille=v},()=>{})}catch(e){}
  try{cv.scrollIntoView({block:'center'})}catch(e){}
  boucle();
}

   donc l'image et le son restent ensemble quel que soit l'appareil. */
function fermeAC(ac){try{if(ac&&ac.state!=='closed')ac.close().catch(()=>{})}catch(e){}}
const FPS=10,pause=ms=>new Promise(r=>setTimeout(r,ms));
async function codecVideo(){
  if(!window.VideoEncoder||!window.VideoFrame||!window.Mp4Muxer)return null;
  const essais=['avc1.42001f','avc1.42E01F','avc1.4d001f','avc1.64001f'].map(c=>({mux:'avc',cfg:{codec:c,avc:{format:'avc'},width:VW,height:VH,bitrate:2500000,framerate:FPS}}));
  if(window.ADAPTCONTE_ESSAI)essais.push({mux:'vp9',cfg:{codec:'vp09.00.31.08',width:VW,height:VH,bitrate:2500000,framerate:FPS}});
  for(const e of essais){try{if((await VideoEncoder.isConfigSupported(e.cfg)).supported)return e}catch(_){}}
  return null;
}
async function codecAudio(sr){
  if(!window.AudioEncoder||!window.AudioData)return null;
  for(const e of [{mux:'aac',codec:'mp4a.40.2'},{mux:'opus',codec:'opus'}]){
    const cfg={codec:e.codec,sampleRate:sr,numberOfChannels:2,bitrate:128000};
    try{if((await AudioEncoder.isConfigSupported(cfg)).supported)return{mux:e.mux,cfg}}catch(_){}
  }
  return null;
}
const dureeMuette=pg=>Math.max(2600,pg.txt.split(' ').length*400+1600);
function lectureMicro(R,x){
  return new Promise(async fini=>{
    try{R.mic=await navigator.mediaDevices.getUserMedia({audio:true})}
    catch(e){R.mode='muet';R.note='Le micro n\'est pas disponible : la vidéo sera sans voix.';R.durees=R.pages.map(dureeMuette);return fini()}
    if(REC!==R)return fini();
    const type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));
    const morceaux=[],t=[];
    try{R.mr=type?new MediaRecorder(R.mic,{mimeType:type}):new MediaRecorder(R.mic)}
    catch(e){R.mode='muet';R.note='Le micro n\'a pas pu démarrer : la vidéo sera sans voix.';R.durees=R.pages.map(dureeMuette);return fini()}
    R.mr.ondataavailable=e=>{if(e.data&&e.data.size)morceaux.push(e.data)};
    R.mr.onstop=async()=>{
      try{R.mic.getTracks().forEach(p=>p.stop())}catch(e){}
      R.suite=null;
      if(REC!==R)return fini();
      R.durees=R.pages.map((p,i)=>Math.max(800,t[i+1]-t[i]));
      try{
        const ab=await new Blob(morceaux).arrayBuffer();
        R.audio=await new Promise((ok,ko)=>R.ac.decodeAudioData(ab,ok,ko));
      }catch(e){R.audio=null;R.note='La voix n\'a pas pu être ajoutée à la vidéo.'}
      fini();
    };
    R.mr.start();t.push(performance.now());R.etat='lecture';R.i=0;
    dessinePage(x,R.imgs,R.pages[0],1e9);majBarre();
    R.suite=()=>{
      t.push(performance.now());
      if(R.i<R.pages.length-1){R.i++;dessinePage(x,R.imgs,R.pages[R.i],1e9);majBarre()}
      else{R.suite=null;try{R.mr.stop()}catch(e){fini()}}
    };
  });
}
async function encodeVideo(R,x,cv,V,A){
  R.etat='encode';R.prep='Fabrication de la vidéo…';majBarre();
  const debuts=[0];R.durees.forEach(d=>debuts.push(debuts[debuts.length-1]+d));
  const total=debuts[debuts.length-1],sr=R.ac?R.ac.sampleRate:0;
  // Piste son : les voix de chaque page (ou la lecture de l'élève) posées à leur place.
  let pcm=null;
  if(R.mode==='synth'){
    pcm=new Float32Array(Math.ceil(total/1000*sr)+sr);
    R.sons.forEach((b,i)=>{const d=b.getChannelData(0),o=Math.round(debuts[i]/1000*sr);pcm.set(d.subarray(0,Math.min(d.length,pcm.length-o)),o)});
  }else if(R.mode==='mic'&&R.audio){
    const d=R.audio.getChannelData(0);pcm=new Float32Array(Math.ceil(total/1000*sr)+sr);pcm.set(d.subarray(0,Math.min(d.length,pcm.length)),0);
  }
  if(pcm&&!A){pcm=null;R.note='Cet appareil ne sait pas mettre le son dans la vidéo.'}
  const mux=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:V.mux,width:VW,height:VH},audio:pcm?{codec:A.mux,sampleRate:sr,numberOfChannels:2}:undefined,fastStart:'in-memory',firstTimestampBehavior:'offset'});
  let erreur=null;
  const venc=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>{erreur=e}});
  venc.configure(V.cfg);
  R.fermer=()=>{try{venc.state!=='closed'&&venc.close()}catch(e){}};
  const N=Math.ceil(total/1000*FPS);let k=0,cle='',nSon=0;
  for(let f=0;f<N;f++){
    const t=f*1000/FPS;
    while(k<R.pages.length-1&&t>=debuts[k+1])k++;
    const pg=R.pages[k],dt=t-debuts[k],n=pg.txt.split(' ').length;
    const nlu=R.mode==='synth'?Math.ceil(n*Math.min(1,dt/(R.sons[k].duration*1000))):R.mode==='mic'?1e9:Math.floor(dt/400);
    if(cle!==k+'/'+Math.min(nlu,n)){cle=k+'/'+Math.min(nlu,n);dessinePage(x,R.imgs,pg,nlu)}
    const img=new VideoFrame(cv,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});
    venc.encode(img,{keyFrame:f%30===0});img.close();
    if(f%5===0){
      R.prep='Fabrication de la vidéo… '+Math.round(f/N*(pcm?85:100))+' %';majBarre();
      await pause(0);
      while(venc.encodeQueueSize>6)await pause(10);
      if(REC!==R||erreur)break;
    }
  }
  if(REC!==R){R.fermer();return}
  if(erreur)throw erreur;
  await venc.flush();
  if(pcm){
    // Le son AAC est rangé « à la main » dans le fichier : certains appareils le livrent avec un en-tête ADTS
    // ou sans sa fiche de description, et le lecteur resterait alors muet.
    const idx=[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000].indexOf(sr);
    const fiche=idx<0?null:new Uint8Array([(2<<3)|(idx>>1),((idx&1)<<7)|(2<<3)]);
    const aenc=new AudioEncoder({error:e=>{erreur=e},output:(c,m)=>{
      try{
        if(A.mux!=='aac'){mux.addAudioChunk(c,m);nSon++;return}
        let d=new Uint8Array(c.byteLength);c.copyTo(d);
        if(d.length>9&&d[0]===0xFF&&(d[1]&0xF6)===0xF0){d=d.subarray((d[1]&1)?7:9);R.adts=true}
        const desc=m&&m.decoderConfig&&m.decoderConfig.description;
        if(!desc)R.sansFiche=true;
        const meta=desc&&!R.adts?m:(nSon===0&&fiche?{decoderConfig:{codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:2,description:fiche}}:undefined);
        mux.addAudioChunkRaw(d,c.type,c.timestamp,c.duration||Math.round(1024/sr*1e6),meta);nSon++;
      }catch(e){erreur=erreur||e}
    }});
    aenc.configure(A.cfg);
    const fin=Math.min(pcm.length,Math.ceil(total/1000*sr)),PAS=4096;
    for(let o=0,j=0;o<fin;o+=PAS,j++){
      const len=Math.min(PAS,fin-o),d=new Float32Array(len*2),seg=pcm.subarray(o,o+len);
      d.set(seg,0);d.set(seg,len);
      const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:len,numberOfChannels:2,timestamp:Math.round(o/sr*1e6),data:d});
      aenc.encode(ad);ad.close();
      if(j%40===0){R.prep='Fabrication de la vidéo… '+Math.round(85+o/fin*15)+' %';majBarre();await pause(0);while(aenc.encodeQueueSize>30)await pause(10);if(REC!==R||erreur)break}
    }
    if(REC!==R){try{aenc.close()}catch(e){}R.fermer();return}
    if(erreur)throw erreur;
    await aenc.flush();aenc.close();
    if(erreur)throw erreur;
  }
  venc.close();mux.finalize();
  R.blob=new Blob([mux.target.buffer],{type:'video/mp4'});R.url=URL.createObjectURL(R.blob);
  R.sonOpus=!!(pcm&&A.mux==='opus');R.etat='fini';
  R.diag='Image '+V.cfg.codec+' · son '+(pcm?A.cfg.codec+' à '+sr+' Hz, '+nSon+' blocs'+(R.adts?', ADTS retiré':'')+(R.sansFiche?', fiche ajoutée':''):'aucun');
  if(pcm&&!nSon)R.note=(R.note?R.note+' ':'')+'Le son n\'a pas pu être encodé sur cet appareil.';
  try{fermeAC(R.ac)}catch(e){}
  if(REC===R&&T.view==='video')rendVideo();
}
async function demarreVideo(mode,ac){
  const V=await codecVideo(),A=ac?await codecAudio(ac.sampleRate):null;
  // Appareil sans WebCodecs (ou sans encodeur de son alors qu'il en faut un) : ancien enregistrement en direct.
  if(!V||(mode!=='muet'&&(!ac||!A)))return videoDirecte(mode==='mic',mode==='synth'?ac:null,mode==='synth');
  const KO_VOIX='La voix de l\'ordinateur n\'est pas disponible : pas de connexion, ou service d\'images à mettre à jour. Choisis « Avec ma voix » ou « Sans voix ».';
  const R=REC={etat:'prep',mode,pages:pagesVideo(),i:0,ac,sons:[],prep:'Préparation…'};
  rendVideo();
  try{
    if(mode==='synth'){
      try{
        for(let i=0;i<R.pages.length;i++){
          R.prep='Préparation de la voix : page '+(i+1)+' sur '+R.pages.length+'…';majBarre();
          const pg=R.pages[i];
          R.sons.push(await sonPage(ac,pg.type==='titre'&&T.auteur?pg.txt+', par '+T.auteur+'.':pg.txt+(pg.type==='etape'?'':'.')));
          if(REC!==R)return;
        }
      }catch(e){if(REC===R){abandonneVideo();REC={etat:'err',err:KO_VOIX};rendVideo()}return}
      R.durees=R.sons.map(b=>b.duration*1000+900);
    }
    R.imgs=await prepareImgs();
    const cv=document.getElementById('toile-video');if(!cv||REC!==R)return;
    const x=cv.getContext('2d');
    if(mode==='muet')R.durees=R.pages.map(dureeMuette);
    if(mode==='mic'){await lectureMicro(R,x);if(REC!==R)return}
    await encodeVideo(R,x,cv,V,A);
  }catch(e){
    if(REC===R){abandonneVideo();REC={etat:'err',err:'La vidéo n\'a pas pu être fabriquée sur cet appareil. Détail : '+(e&&e.message||e)};rendVideo()}
  }
}
function rendVideo(){
  let h='<h2 class="q">🎥 La vidéo de mon histoire</h2>';
  if(!REC)h+='<p style="margin:0">La vidéo montre les pages de ton histoire, une par une, comme un livre.</p><div class="outils"><button class="btn fort" data-a="videoGo" data-v="1">🎤 Avec ma voix : je lis mon histoire</button>'+(T.net?'<button class="btn fort" data-a="videoGo" data-v="2">🔊 Avec la voix de l\'ordinateur</button>':'')+'<button class="btn fort" data-a="videoGo" data-v="0">🔇 Sans voix</button></div><p style="margin:0">Avec ta voix, tu lis la page à voix haute, puis tu touches « Page suivante ». La voix de l\'ordinateur a besoin d\'une connexion.</p><div class="outils"><button class="btn" data-a="film">← Retour au film</button></div>';
  else if(REC.etat==='err')h+='<p style="margin:0">'+esc(REC.err)+'</p><div class="outils"><button class="btn" data-a="film">← Retour au film</button></div>';
  else if(REC.etat==='fini'){
    const mp4=/mp4/.test(REC.blob.type);
    h+='<video class="video" controls playsinline src="'+REC.url+'"></video><div class="outils"><button class="btn fort" data-a="videoGarde">💾 Enregistrer la vidéo</button><button class="btn" data-a="videoRefaire">🔁 Recommencer</button><button class="btn" data-a="film">← Retour au film</button></div>';
    h+='<p style="margin:0;font-size:15px;color:var(--doux)">'+(mp4?'Format MP4 : cette vidéo se lit sur iPad, Android et ordinateur.'+(REC.sonOpus?' Le son est au format Opus : il peut rester muet sur un ancien iPad.':'')+(REC.note?' '+esc(REC.note):'')+(REC.diag?' <span style="font-size:12px">['+esc(REC.diag)+']</span>':''):'Format WebM : cette vidéo se lit sur Android et ordinateur, mais peut ne pas se lire sur iPad. Pour un fichier MP4 lisible partout, crée la vidéo depuis Safari sur iPad ou depuis un Chrome récent.')+'</p>';
  }else h+='<div class="outils" id="video-barre" style="align-items:center;min-height:54px"></div><canvas id="toile-video" width="'+VW+'" height="'+VH+'"></canvas><p style="margin:0;font-size:15px;color:var(--doux)">Pendant l\'enregistrement, laisse cette page affichée sans toucher l\'écran.</p>';
  vue.innerHTML=h;majBarre();
}

/* ---------- Actions ---------- */
function ouvre(n){
  T.step=n;libre=false;T.hub=null;if(IA.n===null)IA.msg='';
  const vide=slots(n).find(id=>T.S[id]===undefined);
  if(vide){T.view='build';T.slot=vide;prepareNom()}else T.view='recap';
  rend();
}
function prepareNom(){if(SL[T.slot].k==='name'){const v=T.S[T.slot];DES={n:(v&&v.syl&&v.syl.length)||2,syl:(v&&v.syl)?v.syl.slice():[],roule:false}}}
function pose(v){T.S[T.slot]=v;OPT={slot:null,items:[]};chercheP(T.slot);if(T.hub){T.slot=T.hub;T.hub=null;T.view='build';rend()}else ouvre(T.step)}
function photo(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const m=1000,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    T.photos[T.step]=c.toDataURL('image/jpeg',.72);rend();
  };im.src=r.result};
  r.readAsDataURL(f);
}
const ACT={
  home(){tais();confirme=false;T.view='home';rend()},
  voix(){T.voice=!T.voice;if(!T.voice)tais();rendChemin();sauve()},
  temps(el){T.tense=el.dataset.t;rend()},
  reprendre(){if(toutFini()){T.view='film';rend()}else ouvre(ETAPES.findIndex((e,i)=>!complet(i)))},
  neuf(el){NIV=+el.dataset.n||1;if(!Object.keys(T.S).length)return ACT.neufOui();archive().then(ok=>{if(ok||!(T.S.herosNom&&T.S.herosNom.t))ACT.neufOui();else{confirme=true;rend()}},()=>{confirme=true;rend()})},
  neufOui(){confirme=false;T.id=Date.now();T.mode='ia';T.niv=NIV;T.S={};T.photos={};T.dessins={};T.pictos={};T.ia={};T.auteur='';OPT={slot:null,items:[]};T.view='auteur';rend()},
  neufNon(){confirme=false;rend()},
  step(el){tais();ouvre(+el.dataset.n)},
  film(){T.view='film';rend()},
  slot(el){T.view='build';T.slot=el.dataset.s;T.hub=T.niv===3&&HUBOF[T.slot]||null;libre=false;prepareNom();rend()},
  dis(el){dis(el.dataset.t)},
  choix(el){pose(OPT.items[+el.dataset.i])},
  autres(){OPT={slot:null,items:[]};rendChoix()},
  libre(){libre=!libre;rendChoix();const c=document.getElementById('mon-idee');c&&c.focus()},
  genre(el){CG=el.dataset.g;const v=document.getElementById('mon-idee').value;rendChoix();document.getElementById('mon-idee').value=v},
  libreOk(){
    const x=document.getElementById('mon-idee').value.trim();if(!x)return;
    const k=SL[T.slot].k;libre=false;
    pose(k==='nom'?{w:x,g:CG,e:'⭐'}:k==='adj'?{m:x,f:x}:k==='verbe'?{ps:x,pc:x,pr:x}:{t:x,e:'⭐'});
  },
  nbdes(el){DES.n=+el.dataset.n;DES.syl=[];rendChoix()},
  lance(){lance()},
  unde(el){lance(DES.syl.length===DES.n?+el.dataset.i:undefined)},
  disNom(){if(DES.syl.length)dis(nomDes())},
  nomOk(){if(DES.syl.length===DES.n)pose({t:maj(nomDes()),syl:DES.syl.slice()})},
  nomLibre(){const x=document.getElementById('mon-nom').value.trim();if(x)pose({t:maj(x)})},
  nomSans(){pose({t:''})},
  photoNon(){delete T.photos[T.step];rend()},
  passe(){pose({skip:true})},
  async ouvreH(el){
    const id=+el.dataset.id;
    try{await archive()}catch(e){}
    try{const r=await bdOp('readonly',st=>st.get(id));if(r)charge(r)}catch(e){}
  },
  supprH(el){BIB.suppr=+el.dataset.id;rendBiblio()},
  supprNon(){BIB.suppr=null;rendBiblio()},
  async supprOui(el){try{await bdOp('readwrite',st=>st.delete(+el.dataset.id))}catch(e){}BIB.suppr=null;rendBiblio()},
  garde(){
    const m=t=>{const z=document.getElementById('sauv-etat');if(z)z.textContent=t};
    ACT.exporte();
    archive().then(()=>m('Histoire enregistrée dans « Mes histoires » et dans le dossier Téléchargements.'),()=>m('Fichier enregistré dans le dossier Téléchargements.'));
  },
  exporte(){telecharge(new Blob([JSON.stringify({adaptconte:1,titre:titre(),data:copie()})],{type:'application/json'}),nomFichier()+'.adaptconte.json')},
  video(){tais();REC=null;T.view='video';rend()},
  videoGo(el){
    const v=el.dataset.v;let ac=null;
    if(v!=='0'){try{ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){ac=null}}
    demarreVideo(v==='1'?'mic':v==='2'?'synth':'muet',ac);
  },
  videoSuite(){if(REC&&REC.suite)REC.suite();else pageSuivante()},
  videoStop(){abandonneVideo();rendVideo()},
  videoRefaire(){abandonneVideo();rendVideo()},
  videoGarde(){if(REC&&REC.blob)telecharge(REC.blob,nomFichier()+(/mp4/.test(REC.blob.type)?'.mp4':'.webm'))},
  net(){T.net=!T.net;rend()},
  mode(el){tais();T.mode=el.dataset.m;rend()},
  async testNet(){
    const z=document.getElementById('diag');if(!z)return;
    const ligne=(ok,m)=>{const p=document.createElement('p');p.style.margin='0';p.textContent=(ok?'✅ ':'❌ ')+m;z.appendChild(p)};
    z.textContent='Test en cours…';
    const res=[];
    try{const r=await fetch('https://api.arasaac.org/api/pictograms/fr/search/chat');const j=await r.json();res.push([j.length>0,'Pictogrammes ARASAAC : '+(j.length>0?'ça marche.':'aucun résultat.')])}
    catch(e){res.push([false,'Pictogrammes ARASAAC : injoignables depuis cette page (pas de connexion, réseau qui bloque arasaac.org, ou aperçu Claude).'])}
    try{
      const r=await fetch(T.urlIA,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scene:'Un chat dort au soleil.',personnages:'',seed:1})});
      const j=await r.json().catch(()=>({}));
      if(r.ok&&j.image)res.push([true,'Images par IA : ça marche.']);
      else if(r.status===403)res.push([false,'Images par IA : le service refuse cette adresse ('+location.origin+'). Il faut l\'ajouter à la liste ORIGINES du code Cloudflare.']);
      else if(/run|binding|AI/.test(j.erreur||''))res.push([false,'Images par IA : le service existe, mais la liaison Workers AI nommée AI manque (étape 3 de l\'installation). Détail : '+j.erreur]);
      else res.push([false,'Images par IA : le service répond une erreur '+r.status+'. Détail : '+(j.erreur||'aucun')]);
    }catch(e){
      res.push([false,'Images par IA : service injoignable depuis cette page. Soit le service adaptconte-images n\'est pas encore créé sur Cloudflare, soit cette page n\'est pas ouverte depuis GitHub Pages ou boussoleebep.fr (adresse actuelle : '+(location.protocol==='file:'?'fichier sur l\'appareil':location.origin)+'), soit le réseau bloque workers.dev.']);
    }
    try{
      const r=await fetch(T.urlIA,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voix:true,texte:'Bonjour.'})});
      const j=await r.json().catch(()=>({}));
      res.push(j.audio?[true,'Voix de l\'ordinateur pour la vidéo : ça marche.']:[false,'Voix de l\'ordinateur pour la vidéo : pas encore disponible. Il faut coller le nouveau code dans Cloudflare. Détail : '+(j.erreur||r.status)]);
    }catch(e){res.push([false,'Voix de l\'ordinateur pour la vidéo : service injoignable depuis cette page.'])}
    try{
      const V=await codecVideo(),sr=(()=>{try{const a=new (window.AudioContext||window.webkitAudioContext)(),r=a.sampleRate;a.close();return r}catch(e){return 48000}})(),A=await codecAudio(sr);
      res.push([!!(V&&A&&A.mux==='aac'),'Vidéo sur cet appareil : image '+(V?V.cfg.codec:'en direct (ancienne méthode)')+' · son '+(A?A.cfg.codec+' à '+sr+' Hz':'non encodable')+'.']);
    }catch(e){}
    z.textContent='';res.forEach(x=>ligne(x[0],x[1]));
  },
  pictoNon(){T.pictos[DR.id].src='';DR=null;T.view='recap';rend()},
  iaNon(){delete T.ia[T.step];rend()},
  async ia(){
    if(IA.n!==null)return;
    const n=T.step;IA={n,msg:'L\'illustration arrive…'};rend();
    try{await illustre(n);IA={n:null,msg:''}}catch(e){IA={n:null,msg:IA_KO}}
    if(T.view==='recap')rend();
  },
  async iaTout(){
    if(IA.n!==null)return;
    const etat=m=>{IA.msg=m;const el=document.getElementById('ia-etat');if(el)el.textContent=m};
    let ko=false;
    for(let n=0;n<5&&!ko;n++){
      if(T.ia[n])continue;
      IA.n=n;etat('Illustration de l\'étape '+(n+1)+' sur 5…');
      try{await illustre(n)}catch(e){ko=true}
    }
    IA={n:null,msg:ko?IA_KO:''};T.mode='ia';
    if(T.view==='film')rend();
  },
  sous(el){T.hub=T.slot;T.slot=el.dataset.s;OPT={slot:null,items:[]};rend()},
  hubOk(){T.hub=null;pose({done:1})},
  hubRetour(){T.slot=T.hub;T.hub=null;rend()},
  enleve(){delete T.S[T.slot];T.slot=T.hub;T.hub=null;rend()},
  dessine(el){DR={id:el.dataset.s};T.view='draw';rend()},
  dessineEtape(){DR={id:null};T.view='draw';rend()},
  couleur(el){PEN.c=el.dataset.c;PEN.gomme=false;majPalette()},
  taille(el){PEN.w=+el.dataset.w;majPalette()},
  gomme(){PEN.gomme=!PEN.gomme;majPalette()},
  defaire(){const d=DR.piles.pop();if(d){DR.x.putImageData(d,0,0);DR.sale=true}},
  efface(){DR.piles.push(DR.x.getImageData(0,0,DR.c.width,DR.c.height));DR.x.clearRect(0,0,DR.c.width,DR.c.height);DR.sale=false},
  dessinOk(){
    const et=DR.id===null;
    if(!DR.sale){if(et)delete T.photos[T.step];else delete T.dessins[DR.id]}
    else{
      const o=document.createElement('canvas');o.width=et?960:400;o.height=et?720:400;
      const ox=o.getContext('2d');if(et){ox.fillStyle='#fff';ox.fillRect(0,0,o.width,o.height)}
      ox.drawImage(DR.c,0,0,o.width,o.height);
      if(et)T.photos[T.step]=o.toDataURL('image/jpeg',.8);else T.dessins[DR.id]=o.toDataURL('image/png');
    }
    DR=null;T.view='recap';rend();
  },
  dessinNon(){DR=null;T.view='recap';rend()},
  imprime(){tais();T.view='print';rend()},
  imprimeGo(){prepareImpression();try{window.print()}catch(e){}},
  impQuoi(el){T.imp.q=el.dataset.v;rend()},
  impPage(el){T.imp.c=el.dataset.v==='1';rend()},
  auteur(){tais();T.view='auteur';rend()},
  auteurOk(){const v=(document.getElementById('auteur').value||'').trim().slice(0,30);T.auteur=v;if(v)T.dernierAuteur=v;apresAuteur()},
  auteurSans(){apresAuteur()},
  joue(){if(F.playing){F.playing=false;F.tok++;tais();boutonJoue()}else{F.playing=true;cadre(F.i>=6?0:F.i)}},
  avant(){cadre(Math.max(0,F.i-1))},
  apres(){cadre(Math.min(6,F.i+1))}
};
document.getElementById('app').addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;
  const f=ACT[el.dataset.a];if(f)f(el);
});
document.getElementById('app').addEventListener('keydown',ev=>{
  if(ev.key==='Enter'){
    if(ev.target.id==='mon-idee')ACT.libreOk();
    else if(ev.target.id==='auteur')ACT.auteurOk();
    else if(ev.target.id==='mon-nom')ACT.nomLibre();
    else if(ev.target.classList.contains('carte'))ev.target.click();
  }
});
document.getElementById('app').addEventListener('change',ev=>{
  if(ev.target.id==='photo-cam'||ev.target.id==='photo-lib')photo(ev.target.files[0]);
  if(ev.target.id==='url-ia'){T.urlIA=ev.target.value.trim();sauve()}
  if(ev.target.id==='import-h')importe(ev.target.files[0]);
});
if(T.view!=='home'&&!Object.keys(T.S).length)T.view='home';
if(T.view==='video'||T.view==='print')T.view='film';
if(T.view==='auteur')T.view=Object.keys(T.S).length&&toutFini()?'film':'home';
if(T.view==='film'&&!toutFini())T.view='home';
if(T.view==='build'&&T.slot)prepareNom();
rend();
})();
</script>
