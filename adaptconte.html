<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<title>Adaptconte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Mise en page : une seule page-écran. En haut le chemin du conte (5 étapes), au centre la phrase qui se construit, en bas les 6 cartes à choisir. */
:root{
  --ciel:#e6f1ff; --papier:#ffffff; --encre:#1b2452; --doux:#5b6590; --trait:#c4d5ef;
  --soleil:#ffc531; --soleil-fonce:#b97f00;
  --nom:#2a6be0; --adj:#17935a; --verbe:#dc3d33; --comp:#c96a00; --name:#8346d4;
  --corps:"Andika","Trebuchet MS","Segoe UI",sans-serif;
  --titre:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ciel);color:var(--encre);font-family:var(--corps);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--name);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:10px 14px;gap:10px}

/* Chemin du conte */
#chemin{display:flex;align-items:center;gap:8px}
.rond{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--trait);background:var(--papier);font-size:20px;display:grid;place-items:center;padding:0}
.etapes{flex:1;min-width:0;display:flex;gap:6px}
.etape{flex:1;min-width:0;border:2px solid var(--trait);background:var(--papier);border-radius:14px;padding:4px 6px;display:flex;align-items:center;gap:6px;text-align:left;color:var(--doux)}
.etape b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ciel);display:grid;place-items:center;font-family:var(--titre);font-size:17px}
.etape span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700}
.etape.fait b{background:var(--adj);color:#fff}
.etape.ici{border-color:var(--encre);color:var(--encre);background:var(--soleil)}
.etape.ici b{background:var(--encre);color:#fff}
.etape:disabled{opacity:.5;cursor:default}
@media (max-width:720px){.etape{justify-content:center}.etape span{display:none}}

#vue>*{flex-shrink:0}
.nb{white-space:nowrap}
#vue{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
h1,h2{font-family:var(--titre);margin:0;line-height:1.1;text-wrap:balance}
.sur{font-size:15px;font-weight:700;color:var(--doux);letter-spacing:.04em;text-transform:uppercase;margin:0}

/* Phrase en construction */
.phrase{background:var(--papier);border-radius:20px;padding:14px 18px;font-size:clamp(20px,2.7vw,28px);line-height:2;border:2px solid var(--trait)}
.phrase.grand{font-size:clamp(24px,3.4vw,36px);line-height:1.8}
.chip{border:0;background:none;padding:0 4px;border-radius:8px;font-weight:700;border-bottom:4px solid currentColor}
.k-nom{color:var(--nom)}.k-adj{color:var(--adj)}.k-verbe{color:var(--verbe)}.k-comp{color:var(--comp)}.k-name{color:var(--name)}
.blank{font-weight:400;font-size:.62em;border:2px dashed currentColor;border-radius:10px;padding:4px 12px;vertical-align:middle;opacity:.75;background:var(--papier)}
.blank.cur{opacity:1;background:var(--soleil);border-style:solid;color:var(--encre);font-weight:700;animation:pouls 1.2s ease-in-out infinite}
.syl-a{color:#2a6be0}.syl-b{color:#dc3d33}
@keyframes pouls{50%{transform:scale(1.08)}}

/* Question et cartes */
.q{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:clamp(22px,3vw,30px)}
.tag{font-family:var(--corps);font-size:15px;font-weight:700;color:#fff;border-radius:99px;padding:3px 12px}
.tag.k-nom{background:var(--nom)}.tag.k-adj{background:var(--adj)}.tag.k-verbe{background:var(--verbe)}.tag.k-comp{background:var(--comp)}.tag.k-name{background:var(--name)}
.cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.cartes{grid-template-columns:repeat(2,1fr)}}
.carte{position:relative;min-width:0;background:var(--papier);border:3px solid currentColor;border-radius:20px;padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:112px;cursor:pointer;box-shadow:0 5px 0 currentColor;transition:transform .08s}
.carte:active{transform:translateY(4px);box-shadow:0 1px 0 currentColor}
.carte .em{font-size:44px;line-height:1.1}
.carte .mot{color:var(--encre);font-size:clamp(19px,2.4vw,25px);font-weight:700;text-align:center;overflow-wrap:anywhere}
.carte.sans .mot{font-size:clamp(22px,3vw,30px)}
.ecoute{position:absolute;top:4px;right:4px;width:38px;height:38px;border-radius:50%;border:0;background:var(--ciel);font-size:17px;padding:0}
.outils{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--encre);background:var(--papier);border-radius:16px;padding:10px 18px;font-weight:700;font-size:18px;display:inline-flex;align-items:center;gap:8px;min-height:50px;cursor:pointer}
.btn.fort{background:var(--soleil);box-shadow:0 4px 0 var(--soleil-fonce);font-size:21px;padding:12px 24px}
.btn.fort:active{transform:translateY(3px);box-shadow:0 1px 0 var(--soleil-fonce)}
.btn.choisi{background:var(--encre);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.champ{border:2px solid var(--encre);border-radius:14px;padding:10px 14px;font-size:20px;min-width:0;flex:1 1 180px;background:var(--papier)}
.boite{background:var(--papier);border:2px dashed var(--trait);border-radius:18px;padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Dés */
.des{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding-block:6px}
.de{width:clamp(92px,17vw,132px);aspect-ratio:1;border-radius:24px;border:3px solid var(--encre);background:var(--papier);box-shadow:0 7px 0 var(--encre);font-family:var(--titre);font-size:clamp(34px,6vw,52px);display:grid;place-items:center;padding:0}
.de.roule{animation:roule .35s linear infinite}
@keyframes roule{0%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-12px)}100%{transform:rotate(-9deg) translateY(0)}}
.nomde{text-align:center;font-family:var(--titre);font-size:clamp(40px,7vw,64px);min-height:1.2em;line-height:1.2}
.centre{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}

/* Accueil */
.accueil{display:grid;gap:18px;padding-block:8px}
.accueil h1{font-size:clamp(44px,8vw,76px)}
.accueil h1 em{font-style:normal;color:var(--name)}
.accueil p{margin:0;max-width:60ch}
.plan{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0;padding:0;list-style:none}
@media (max-width:720px){.plan{grid-template-columns:1fr}}
.plan li{background:var(--papier);border-radius:16px;padding:10px 12px;border:2px solid var(--trait);min-width:0}
.plan b{font-family:var(--titre);font-size:20px;display:block}
.plan i{font-style:normal;color:var(--name);font-weight:700;display:block}
.plan small{color:var(--doux);font-size:14px}
.adulte{border-top:2px solid var(--trait);padding-top:12px;display:grid;gap:8px}

/* Film */
.scene{position:relative;overflow:hidden;border-radius:24px;aspect-ratio:16/9;width:100%;max-width:760px;margin-inline:auto;font-size:clamp(46px,11vw,104px);border:3px solid var(--encre);background:#bfe3ff}
.scene .e{position:absolute;line-height:1;bottom:9%}
.scene img.plein{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;animation:zoom 9s ease-out both}
.scene .carton{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px;padding:16px}
.scene .carton span{font-size:1em;line-height:1.1}
.scene .carton strong{font-family:var(--titre);font-size:.42em;line-height:1.1;color:var(--encre)}
.s0{background:linear-gradient(#fff3c4,#ffd76a)}
.s1{background:linear-gradient(#aedcff 60%,#9fd98a 60%)}
.s2{background:linear-gradient(#8f93b8 60%,#77806f 60%)}
.s3{background:linear-gradient(#c9ecc0 60%,#8fbf6c 60%)}
.s4{background:linear-gradient(#ffe7a3 60%,#e9c15f 60%)}
.s5{background:linear-gradient(#ffb98a,#ffd9a8 60%,#9fd98a 60%)}
.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
.bob{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both,bob 1.4s ease-in-out .7s infinite}
.gauche{animation:gauche 1.6s ease-out both}
.droite{animation:droite 1.2s ease-out both}
.vole{animation:vole 1.6s ease-in 1.5s both}
.fuit{animation:fuit 1.4s ease-in 1.4s both}
.brille{animation:brille 1.2s ease-in-out infinite}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-10%)}}
@keyframes gauche{from{transform:translateX(-260%)}to{transform:none}}
@keyframes droite{from{transform:translateX(260%)}to{transform:none}}
@keyframes vole{to{transform:translate(170%,-60%) scale(.5) rotate(25deg)}}
@keyframes fuit{to{transform:translate(120%,-120%) scale(0) rotate(540deg)}}
@keyframes brille{50%{opacity:.25;transform:scale(.7)}}
@keyframes zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
.legende{font-size:clamp(22px,3vw,30px);text-align:center;margin:0;min-height:3em;max-width:760px;margin-inline:auto}
.legende span{opacity:.3;transition:opacity .2s}
.legende span.on{opacity:1}
.conte{background:var(--papier);border-radius:20px;border:2px solid var(--trait);padding:16px 20px;display:grid;gap:10px;font-size:20px}
.conte h2{font-size:28px}
.conte p{margin:0;max-width:65ch}
.conte small{display:block;color:var(--doux);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.vignette{height:64px;border-radius:10px;border:2px solid var(--encre)}
.dess{object-fit:contain;display:block}
.scene .dess{width:1.25em;height:1.25em}
.btn .dess{width:36px;height:36px}
/* Atelier de dessin */
.atelier{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.chevalet{flex:1 1 320px;min-width:0;text-align:center}
#toile{max-width:100%;max-height:62vh;background:#fff;border:3px solid var(--encre);border-radius:16px;touch-action:none;cursor:crosshair}
.palette{display:grid;gap:12px;max-width:100%}
.rang{display:flex;gap:8px;flex-wrap:wrap;max-width:272px;align-items:center}
.pastille{width:46px;height:46px;border-radius:50%;border:2px solid var(--encre);padding:0}
.pastille.choisi{box-shadow:0 0 0 3px var(--papier),0 0 0 7px var(--encre)}
.taille{padding:0;width:54px;justify-content:center}
.taille i{display:block;border-radius:50%;background:var(--encre)}
.taille.choisi i{background:#fff}
/* Impression */
#impression{display:none}
@media print{
  @page{margin:1.5cm}
  html,body{height:auto;background:#fff}
  #app{display:none}
  #impression{display:block;color:#000;font-size:15pt;line-height:1.5}
  #impression h1{font-size:30pt;margin:0}
  #impression .auteur{margin:4pt 0 0;font-size:12pt}
  #impression section{break-inside:avoid;border-top:1pt solid #888;margin-top:14pt;padding-top:8pt}
  #impression h2{font-size:15pt;margin:0}
  #impression h2 small{font-family:var(--corps);font-weight:400;font-size:10pt;color:#444}
  #impression p{margin:4pt 0}
  #impression figure{display:inline-block;vertical-align:top;margin:6pt 10pt 0 0;text-align:center;font-size:10pt}
  #impression .ill{max-width:100%;max-height:8cm;border:1pt solid #000;border-radius:6pt}
  #impression .mini{height:3.4cm;width:3.4cm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <nav id="chemin" aria-label="Les étapes du conte"></nav>
  <main id="vue"></main>
</div>
<div id="impression"></div>

<script>
(function(){
"use strict";
/* ---------- Banques de mots ---------- */
const N=s=>s.split('|').map(x=>{const[w,g,e]=x.split(',');return{w,g,e}});

/* ---------- État ---------- */
const CLE='adaptconte-v1';

/* ---------- Grammaire ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const voy=s=>/^[aeiouyàâéèêëîïôöûœ]/i.test(s||'');
const plu=g=>g.length>1;
const un=g=>plu(g)?'des':g==='f'?'une':'un';
const le=(g,suite)=>plu(g)?'les':voy(suite)?"l'":(g==='f'?'la':'le');
const de=suite=>voy(suite)?"d'":'de';
const acc=(a,g)=>{const x=g[0]==='f'?a.f:a.m;return plu(g)&&!/[sx]$/.test(x)?x+'s':x};
const vt=v=>v[T.tense];
const maj=s=>s.charAt(0).toUpperCase()+s.slice(1);
const hero=()=>T.S.heros||{w:'héros',g:'m',e:'🙂'};
const pro=()=>hero().g==='f'?'elle':'il';
const prenom=()=>(T.S.herosNom&&T.S.herosNom.t)||'ton héros';
const leN=n=>{const d=le(n.g,n.w);return d+(d.endsWith("'")?'':' ')+n.w};
const SL={
 heros:{k:'nom',q:()=>'Qui est le héros de ton histoire ?'},
 herosNom:{k:'name',q:()=>'Comment s\'appelle '+leN(hero())+' ?'},
 phys:{k:'adj',of:'heros',q:()=>'Comment est son corps ?'},

 verbe1:{k:'verbe',q:()=>'Que faisait-'+pro()+' ?'},
 lieu:{k:'comp',lab:'où ?',q:()=>'Où ?'},
 lieuNom:{k:'name',opt:true,q:()=>'Comment s\'appelle cet endroit ?'},
 mechant:{k:'nom',q:()=>'Qui arrive et pose un problème ?'},
 adjM:{k:'adj',of:'mechant',q:()=>'Comment est '+leN(T.S.mechant)+' ?'},
 porteM:{k:'nom',pool:'porte',q:()=>'Que porte '+leN(T.S.mechant)+' ?'},
 verbe2:{k:'verbe',q:()=>'Que fait '+leN(T.S.mechant)+' ?'},
 objet:{k:'comp',lab:'quoi ?',q:()=>'Quoi ?'},
 verbe3:{k:'verbe',q:()=>'Que fait '+prenom()+' pour arranger le problème ?'},
 lieu3:{k:'nom',det:'le',lab:'quoi ?',q:()=>'Quel endroit ?'},
 adjL:{k:'adj',of:'lieu3',q:()=>'Comment est '+leN(T.S.lieu3)+' ?'},
 ami:{k:'nom',q:()=>'Qui rencontre-t-'+pro()+' en chemin ?'},
 adjA:{k:'adj',of:'ami',q:()=>'Comment est '+leN(T.S.ami)+' ?'},
 moyen:{k:'nom',q:()=>'Quel objet va aider '+prenom()+' ?'},
 adjMo:{k:'adj',of:'moyen',q:()=>'Comment est '+leN(T.S.moyen)+' ?'},
 verbe4:{k:'verbe',q:()=>'Que fait '+prenom()+' ? ('+leN(T.S.mechant)+')'},
 etat:{k:'adj',of:'heros',q:()=>'Comment se sent '+prenom()+' maintenant ?'},
 verbe5:{k:'verbe',q:()=>'Que fait-'+pro()+' depuis ce jour ?'},
 ccl5:{k:'comp',lab:'où ? quand ?',q:()=>'Où ou quand ?'}
};
function etiquette(id,it){
  const d=SL[id];
  if(d.k==='nom')return d.det==='le'?leN(it):un(it.g)+' '+it.w;
  if(d.k==='adj')return acc(it,(T.S[d.of]||{g:'m'}).g);
  if(d.k==='verbe')return vt(it);
  return it.t;
}
/* Construit la phrase d'une étape : liste de morceaux (texte fixe, mot choisi, ou case vide). */
function morceaux(n){
  const S=T.S,p=[];
  const t=x=>p.push({t:x}),g=x=>p.push({t:x,gl:1});
  const vide=id=>p.push({b:1,s:id,k:SL[id].k});
  const sl=id=>{S[id]===undefined?vide(id):p.push({t:etiquette(id,S[id]),s:id,k:SL[id].k})};
  const nm=id=>{const v=S[id];if(v===undefined)return vide(id);if(v.t)p.push({t:v.t,syl:v.syl,s:id,k:'name'})};
  const gn=(det,nid,aids,simple)=>{
    const nn=S[nid];
    if(!nn){vide(nid);aids.forEach(vide);return}
    const fl=aids.filter(a=>S[a]).map(id=>({id,a:S[id]}));
    const pre=fl.filter(x=>x.a.pre),post=fl.filter(x=>!x.a.pre);
    const d=det==='un'?un(nn.g):le(nn.g,pre.length?acc(pre[0].a,nn.g):nn.w);
    p.push({t:d,glue:d.endsWith("'")});
    const mot=(txt,id,k)=>p.push(simple?{t:txt}:{t:txt,s:id,k});
    pre.forEach(x=>mot(acc(x.a,nn.g),x.id,'adj'));
    mot(nn.w,nid,'nom');
    post.forEach((x,i)=>{if(i)t('et');mot(acc(x.a,nn.g),x.id,'adj')});
    if(!simple)aids.filter(a=>!S[a]).forEach(vide);
  };
  const nomHero=()=>t(prenom());
  if(n===0){
    t('Il était une fois');gn('un','heros',['phys','moral']);t("qui s'appelait");nm('herosNom');g('.');
    t(maj(pro()));t('portait');gn('un','porte',['adjP']);g('.');
    t(maj(pro()));sl('verbe1');sl('lieu');
    if(S.lieuNom===undefined)vide('lieuNom');
    else if(S.lieuNom.t){const d=de(S.lieuNom.t);p.push({t:d,glue:d.endsWith("'")});nm('lieuNom')}
    g('.');
  }else if(n===1){
    t('Un jour,');gn('un','mechant',['adjM']);t('avec');gn('un','porteM',[]);sl('verbe2');sl('objet');
    const d=de(prenom());p.push({t:d,glue:d.endsWith("'")});nomHero();g('.');
  }else if(n===2){
    t('Alors,');nomHero();sl('verbe3');gn('le','lieu3',['adjL']);g('.');
    t('En chemin,');t(pro());t(FIXE.renc[T.tense]);gn('un','ami',['adjA']);g('.');
  }else if(n===3){
    t('Enfin, grâce à');gn('un','moyen',['adjMo']);g(',');nomHero();sl('verbe4');
    if(S.mechant)gn('le','mechant',[],true);
    t('et');t(FIXE.retr[T.tense]);if(S.objet)t(S.objet.t);g('.');
  }else{
    t('Depuis ce jour,');nomHero();t('est');sl('etat');g('.');
    t(maj(pro()));sl('verbe5');sl('ccl5');
    if(S.ami){t('avec');gn('le','ami',['adjA'],true)}
    g('.');
  }
  return p;
}
function assemble(ps,rendu){let o='',glue=true;ps.forEach(p=>{if(!glue&&!p.gl)o+=' ';o+=rendu(p);glue=!!p.glue});return o}
const texte=n=>assemble(morceaux(n).filter(p=>!p.b),p=>p.t);
function sylHtml(p){return p.syl?p.syl.map((s,i)=>'<span class="syl-'+(i%2?'b':'a')+'">'+esc(i?s:maj(s))+'</span>').join(''):esc(p.t)}
function phraseHtml(n,cur){
  const o=[];let glue=false;
  morceaux(n).forEach(p=>{
    let h;
    if(p.b)h='<button class="chip blank k-'+p.k+(p.s===cur?' cur':'')+'" data-a="slot" data-s="'+p.s+'">'+(SL[p.s].lab||VIDE[p.k])+'</button>';
    else if(p.s)h='<button class="chip k-'+p.k+'" data-a="slot" data-s="'+p.s+'" title="Changer ce mot">'+sylHtml(p)+'</button>';
    else h=esc(p.t);
    if(o.length&&(p.gl||glue))o[o.length-1]='<span class="nb">'+o[o.length-1]+h+'</span>';
    else o.push(h);
    glue=!!p.glue;
  });
  return o.join(' ');
}
const complet=n=>ETAPES[n].slots.every(id=>T.S[id]!==undefined);
const toutFini=()=>ETAPES.every((e,i)=>complet(i));
const titre=()=>{const n=prenom();const d=de(n);return "L'histoire "+d+(d.endsWith("'")?'':' ')+n};

/* ---------- Voix ---------- */
function dis(txt,fin){
  let fait=false;const ok=()=>{if(!fait){fait=true;fin&&fin()}};
  if(!T.voice||!('speechSynthesis' in window))return ok();
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;
    u.onend=ok;u.onerror=ok;speechSynthesis.speak(u);
    if(fin)setTimeout(ok,txt.length*120+4000);
  }catch(e){ok()}
}
const tais=()=>{try{speechSynthesis.cancel()}catch(e){}};

/* ---------- Rendu ---------- */
const vue=document.getElementById('vue'),chemin=document.getElementById('chemin');
function melange(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rendChemin(){
  let h='<button class="rond" data-a="home" aria-label="Accueil">🏠</button><div class="etapes">';
  ETAPES.forEach((e,i)=>{
    const ok=i===0||complet(i-1),ici=T.view!=='home'&&T.view!=='film'&&T.step===i;
    h+='<button class="etape'+(complet(i)?' fait':'')+(ici?' ici':'')+'" data-a="step" data-n="'+i+'"'+(ok?'':' disabled')+' title="'+e.nom+'"><b>'+(complet(i)&&!ici?'✓':i+1)+'</b><span>'+e.court+'</span></button>';
  });
  h+='<button class="etape'+(T.view==='film'?' ici':'')+'" data-a="film"'+(toutFini()?'':' disabled')+' title="Mon histoire animée"><b>🎬</b><span>Mon film</span></button></div>';
  h+='<button class="rond" data-a="voix" aria-label="Voix">'+(T.voice?'🔊':'🔇')+'</button>';

  else if(T.view==='draw')rendDessin();
  else rendFilm();

function entete(){const e=ETAPES[T.step];return '<p class="sur">Étape '+(T.step+1)+' · '+e.nom+' · '+e.aide+'</p>'}

    });

function nomDes(){return DES.syl.join('')}
function rendDes(d){
  let h='<div class="centre"><button class="btn'+(DES.n===2?' choisi':'')+'" data-a="nbdes" data-n="2">2 dés</button><button class="btn'+(DES.n===3?' choisi':'')+'" data-a="nbdes" data-n="3">3 dés</button></div><div class="des">';
  for(let i=0;i<DES.n;i++)h+='<button class="de" data-a="unde" data-i="'+i+'" aria-label="Relancer ce dé">'+(DES.syl[i]||'?')+'</button>';
  h+='</div><div class="nomde" id="nomde">'+(DES.syl.length?sylHtml({syl:DES.syl}):'')+'</div>';
  h+='<div class="centre"><button class="btn fort" data-a="lance">🎲 Lancer les dés</button><button class="btn fort" data-a="nomOk" id="nom-ok"'+(DES.syl.length===DES.n?'':' disabled')+'>✔ Je garde ce nom</button><button class="rond" data-a="disNom" aria-label="Écouter le nom">🔊</button></div>';
  h+='<div class="boite"><input class="champ" id="mon-nom" autocomplete="off" placeholder="Ou j\'écris le nom"><button class="btn" data-a="nomLibre">OK</button>'+(d.opt?'<button class="btn" data-a="nomSans">Pas de nom</button>':'')+'</div>';
  return h;
}
function tirer(i){
  for(let k=0;k<60;k++){
    const s=DES.syl.slice();
    if(i===undefined)for(let j=0;j<DES.n;j++)s[j]=SYL[Math.floor(Math.random()*SYL.length)];
    else s[i]=SYL[Math.floor(Math.random()*SYL.length)];
    s.length=DES.n;
    if(s.some((x,j)=>j&&x===s[j-1])||INTERDIT.test(s.join('')))continue;
    DES.syl=s;return;
  }
}
function lance(i){
  if(DES.roule)return;DES.roule=true;
  const des=[...vue.querySelectorAll('.de')].filter((x,j)=>i===undefined||j===i);
  des.forEach(x=>x.classList.add('roule'));
  let n=0;const iv=setInterval(()=>{
    des.forEach(x=>x.textContent=SYL[Math.floor(Math.random()*SYL.length)]);
    if(++n>9){clearInterval(iv);DES.roule=false;if(i!==undefined&&DES.syl.length!==DES.n)i=undefined;tirer(i);rendChoix();dis(nomDes())}
  },75);
}

const DESS=[['heros','porte','lieu'],['mechant','porteM','objet'],['lieu3','ami'],['moyen'],[]];
const COUL=['#1b1b1b','#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#f06292','#795548','#9e9e9e'];
let DR=null,PEN={c:COUL[0],w:10,gomme:false};
function fig(id){return T.dessins[id]?'<img class="dess" src="'+T.dessins[id]+'" alt="">':((T.S[id]&&T.S[id].e)||'⭐')}

function majPalette(){
  vue.querySelectorAll('.pastille').forEach(b=>b.classList.toggle('choisi',!PEN.gomme&&b.dataset.c===PEN.c));
  vue.querySelectorAll('.taille').forEach(b=>b.classList.toggle('choisi',+b.dataset.w===PEN.w));
  const g=document.getElementById('gomme');if(g)g.classList.toggle('choisi',PEN.gomme);
}
function initToile(){
  const c=document.getElementById('toile'),x=c.getContext('2d');
  DR.c=c;DR.x=x;DR.piles=[];DR.sale=false;
  x.lineCap=x.lineJoin='round';
  const src=DR.id===null?T.photos[T.step]:T.dessins[DR.id];
  if(src){const im=new Image();im.onload=()=>{const k=Math.min(c.width/im.width,c.height/im.height),w=im.width*k,hh=im.height*k;x.globalCompositeOperation='source-over';x.drawImage(im,(c.width-w)/2,(c.height-hh)/2,w,hh);DR.sale=true};im.src=src}
  let der=null;
  const pt=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
  const trait=(a,b)=>{x.globalCompositeOperation=PEN.gomme?'destination-out':'source-over';x.strokeStyle=PEN.c;x.lineWidth=(PEN.gomme?PEN.w*2.5:PEN.w)*c.width/600;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()};
  c.addEventListener('pointerdown',e=>{
    e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}
    DR.piles.push(x.getImageData(0,0,c.width,c.height));if(DR.piles.length>12)DR.piles.shift();
    der=pt(e);trait(der,{x:der.x+.01,y:der.y});DR.sale=true;
  });
  c.addEventListener('pointermove',e=>{if(!der)return;e.preventDefault();const p=pt(e);trait(der,p);der=p});
  const fin=()=>{der=null};c.addEventListener('pointerup',fin);c.addEventListener('pointercancel',fin);
}
function prepareImpression(){

    h+='<section><h2>'+(i+1)+'. '+e.court+' <small>('+e.nom.toLowerCase()+')</small></h2><p>'+esc(texte(i))+'</p><div>';
    if(T.photos[i])h+='<figure><img class="ill" src="'+T.photos[i]+'" alt=""></figure>';
    DESS[i].forEach(id=>{if(T.dessins[id])h+='<figure><img class="mini dess" src="'+T.dessins[id]+'" alt=""><figcaption>'+esc(nomChose(id))+'</figcaption></figure>'});
    h+='</div></section>';
  });
  document.getElementById('impression').innerHTML=h;
}

/* ---------- Film ---------- */
function sceneHtml(i){
  const e=(id,cl,st)=>'<span class="e '+cl+'" style="'+st+'">'+fig(id)+'</span>';
  if(i===0)return '<div class="scene s0"><div class="carton"><span class="pop">'+fig('heros')+'</span><strong>'+esc(titre())+'</strong></div></div>';
  if(i===6)return '<div class="scene s0"><div class="carton"><span class="brille">✨</span><strong style="font-size:1em">Fin</strong></div></div>';
  const n=i-1;
  if(T.photos[n])return '<div class="scene s'+i+'"><img class="plein" src="'+T.photos[n]+'" alt="Mon dessin de l\'étape '+i+'"></div>';
  let h='<div class="scene s'+i+'">';
  if(i===1)h+=e('lieu','','left:6%;font-size:1.7em;bottom:14%')+e('heros','bob','left:50%')+e('porte','pop','left:74%;bottom:32%;font-size:.5em;animation-delay:.9s');
  if(i===2)h+=e('heros','','left:6%;font-size:.75em')+e('objet','vole','left:34%;font-size:.7em')+e('mechant','droite','right:6%;font-size:1.4em')+e('porteM','pop','right:34%;bottom:46%;font-size:.5em;animation-delay:1.2s');
  if(i===3)h+=e('lieu3','','left:8%;bottom:34%')+e('lieu3','','left:40%;bottom:38%;font-size:1.2em')+e('lieu3','','left:74%;bottom:34%')+e('heros','gauche','left:30%')+e('ami','pop','right:14%;animation-delay:1.7s');
  if(i===4)h+=e('heros','gauche','left:10%')+e('moyen','pop','left:27%;bottom:42%;font-size:.7em;animation-delay:.8s')+e('mechant','fuit','right:10%;font-size:1.3em')+e('objet','pop','left:46%;font-size:.75em;animation-delay:2.6s');
  if(i===5)h+=e('ccl5','pop','left:44%;bottom:58%;font-size:.8em')+e('heros','bob','left:30%')+e('ami','bob','left:54%;animation-delay:.3s,1s')+'<span class="e brille" style="left:10%;bottom:62%;font-size:.5em">✨</span><span class="e brille" style="right:10%;bottom:54%;font-size:.5em;animation-delay:.5s">✨</span>';
  return h+'</div>';
}
const cadreTexte=i=>i===0?titre():i===6?'Fin.':texte(i-1);
function rendFilm(){
  let h='<div id="scene"></div><p class="legende" id="legende"></p><div class="centre"><button class="btn" data-a="avant" aria-label="Image précédente">◀</button><button class="btn fort" data-a="joue" id="joue">▶ Regarder mon histoire</button><button class="btn" data-a="apres" aria-label="Image suivante">▶</button></div>';
  h+='<article class="conte"><h2>'+esc(titre())+'</h2>';
  ETAPES.forEach((e,i)=>{h+='<p><small>'+(i+1)+'. '+e.nom+'</small>'+esc(texte(i))+'</p>'});
  h+='</article><div class="outils"><button class="btn fort" data-a="imprime">🖨 Imprimer mon histoire</button><button class="btn" data-a="step" data-n="0">✏️ Changer des mots</button><button class="btn" data-a="home">🏠 Accueil</button></div>';
  vue.innerHTML=h;
  prepareImpression();
  cadre(0,true);
}
function boutonJoue(){const b=document.getElementById('joue');if(b)b.textContent=F.playing?'⏹ Arrêter':'▶ Regarder mon histoire'}
function cadre(i,muet){
  F.i=i;const tok=++F.tok;
  const sc=document.getElementById('scene'),lg=document.getElementById('legende');if(!sc)return;
  sc.innerHTML=sceneHtml(i);
  const txt=cadreTexte(i);
  lg.innerHTML=txt.split(' ').map(w=>'<span'+(muet?' class="on"':'')+'>'+esc(w)+'</span>').join(' ');
  boutonJoue();
  if(muet)return;
  const mots=[...lg.children];let k=0,a=false,b=false;
  const suite=()=>{
    if(!a||!b||tok!==F.tok||!F.playing)return;
    if(i<6)setTimeout(()=>{if(tok===F.tok&&F.playing)cadre(i+1)},1200);
    else{F.playing=false;boutonJoue()}
  };
  const tic=()=>{if(tok!==F.tok)return;if(k<mots.length){mots[k++].classList.add('on');setTimeout(tic,430)}else{a=true;suite()}};
  dis(txt,()=>{b=true;suite()});tic();
}

/* ---------- Actions ---------- */
function ouvre(n){
  T.step=n;libre=false;
  const vide=ETAPES[n].slots.find(id=>T.S[id]===undefined);
  if(vide){T.view='build';T.slot=vide;prepareNom()}else T.view='recap';
  rend();
}
function prepareNom(){if(SL[T.slot].k==='name'){const v=T.S[T.slot];DES={n:(v&&v.syl&&v.syl.length)||2,syl:(v&&v.syl)?v.syl.slice():[],roule:false}}}
function pose(v){T.S[T.slot]=v;OPT={slot:null,items:[]};ouvre(T.step)}
function photo(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const m=1000,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    T.photos[T.step]=c.toDataURL('image/jpeg',.72);rend();
  };im.src=r.result};
  r.readAsDataURL(f);
}
const ACT={
  home(){tais();confirme=false;T.view='home';rend()},
  voix(){T.voice=!T.voice;if(!T.voice)tais();rendChemin();sauve()},
  temps(el){T.tense=el.dataset.t;rend()},
  reprendre(){if(toutFini()){T.view='film';rend()}else ouvre(ETAPES.findIndex((e,i)=>!complet(i)))},
  neuf(){if(Object.keys(T.S).length){confirme=true;rend()}else ACT.neufOui()},
  neufOui(){confirme=false;T.S={};T.photos={};T.dessins={};ouvre(0)},
  neufNon(){confirme=false;rend()},
  step(el){tais();ouvre(+el.dataset.n)},
  film(){T.view='film';rend()},
  slot(el){T.view='build';T.slot=el.dataset.s;libre=false;prepareNom();rend()},
  dis(el){dis(el.dataset.t)},
  choix(el){pose(OPT.items[+el.dataset.i])},
  autres(){OPT={slot:null,items:[]};rendChoix()},
  libre(){libre=!libre;rendChoix();const c=document.getElementById('mon-idee');c&&c.focus()},
  genre(el){CG=el.dataset.g;const v=document.getElementById('mon-idee').value;rendChoix();document.getElementById('mon-idee').value=v},
  libreOk(){
    const x=document.getElementById('mon-idee').value.trim();if(!x)return;
    const k=SL[T.slot].k;libre=false;
    pose(k==='nom'?{w:x,g:CG,e:'⭐'}:k==='adj'?{m:x,f:x}:k==='verbe'?{ps:x,pc:x,pr:x}:{t:x,e:'⭐'});
  },
  nbdes(el){DES.n=+el.dataset.n;DES.syl=[];rendChoix()},
  lance(){lance()},
  unde(el){lance(DES.syl.length===DES.n?+el.dataset.i:undefined)},
  disNom(){if(DES.syl.length)dis(nomDes())},
  nomOk(){if(DES.syl.length===DES.n)pose({t:maj(nomDes()),syl:DES.syl.slice()})},
  nomLibre(){const x=document.getElementById('mon-nom').value.trim();if(x)pose({t:maj(x)})},
  nomSans(){pose({t:''})},
  photoNon(){delete T.photos[T.step];rend()},
  dessine(el){DR={id:el.dataset.s};T.view='draw';rend()},
  dessineEtape(){DR={id:null};T.view='draw';rend()},
  couleur(el){PEN.c=el.dataset.c;PEN.gomme=false;majPalette()},
  taille(el){PEN.w=+el.dataset.w;majPalette()},
  gomme(){PEN.gomme=!PEN.gomme;majPalette()},
  defaire(){const d=DR.piles.pop();if(d){DR.x.putImageData(d,0,0);DR.sale=true}},
  efface(){DR.piles.push(DR.x.getImageData(0,0,DR.c.width,DR.c.height));DR.x.clearRect(0,0,DR.c.width,DR.c.height);DR.sale=false},
  dessinOk(){
    const et=DR.id===null;
    if(!DR.sale){if(et)delete T.photos[T.step];else delete T.dessins[DR.id]}
    else{
      const o=document.createElement('canvas');o.width=et?960:400;o.height=et?720:400;
      const ox=o.getContext('2d');if(et){ox.fillStyle='#fff';ox.fillRect(0,0,o.width,o.height)}
      ox.drawImage(DR.c,0,0,o.width,o.height);
      if(et)T.photos[T.step]=o.toDataURL('image/jpeg',.8);else T.dessins[DR.id]=o.toDataURL('image/png');
    }
    DR=null;T.view='recap';rend();
  },
  dessinNon(){DR=null;T.view='recap';rend()},
  imprime(){tais();prepareImpression();try{window.print()}catch(e){}},
  joue(){if(F.playing){F.playing=false;F.tok++;tais();boutonJoue()}else{F.playing=true;cadre(F.i>=6?0:F.i)}},
  avant(){cadre(Math.max(0,F.i-1))},
  apres(){cadre(Math.min(6,F.i+1))}
};
document.getElementById('app').addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;
  const f=ACT[el.dataset.a];if(f)f(el);
});
document.getElementById('app').addEventListener('keydown',ev=>{
  if(ev.key==='Enter'){
    if(ev.target.id==='mon-idee')ACT.libreOk();
    else if(ev.target.id==='mon-nom')ACT.nomLibre();
    else if(ev.target.classList.contains('carte'))ev.target.click();
  }
});
document.getElementById('app').addEventListener('change',ev=>{
  if(ev.target.id==='photo-cam'||ev.target.id==='photo-lib')photo(ev.target.files[0]);
});
if(T.view!=='home'&&!Object.keys(T.S).length)T.view='home';
if(T.view==='film'&&!toutFini())T.view='home';
if(T.view==='build'&&T.slot)prepareNom();
rend();
})();
</script>
